name: cairn review

# The gate that cannot be skipped. /api/submit scanning and the pre-commit hook
# both run on the contributor's machine, which means an attacker simply does not
# run them: a finding hand-written into a pull request touches neither. This
# does, on every change to the corpus.
on:
  pull_request:
    paths: ['cairn/**', 'keys/**']

# Least privilege: this job reads a diff and calls out to review APIs. It has
# no reason to be able to write to the repository.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Maintainers may bootstrap the migration with an independently approved
      # immutable tooling revision. Never derive this pin from the PR head.
      - name: Resolve trusted tooling revision
        id: tooling
        env:
          APPROVED_SHA: ${{ vars.CAIRN_REVIEW_TOOLING_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ref="${APPROVED_SHA:-$BASE_SHA}"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CAIRN_REVIEW_TOOLING_SHA must be an independently approved full commit SHA, never a branch or tag."
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      # The tooling comes from the BASE branch or the maintainer-approved
      # immutable pin above; only the corpus comes from the pull request.
      #
      # `paths:` decides whether this workflow runs, not what gets checked out.
      # Checking out the merge ref and running `npm ci && npm run cairn:adjudicate`
      # meant a pull request that touched cairn/** AND scripts/ ran its own
      # modified adjudicator — with the provider keys in the environment. The
      # gate was executed by the code it was gating. Fork pull requests are not
      # given secrets, so that path failed closed; a same-repo branch is not,
      # and this repository works on same-repo branches.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tooling.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require trusted review tooling
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const scripts = JSON.parse(fs.readFileSync('package.json', 'utf8')).scripts || {};
          const required = ['cairn:lint', 'cairn:audit', 'test', 'cairn:adjudicate', 'cairn:review'];
          const missing = required.filter(name => typeof scripts[name] !== 'string' || !scripts[name].trim());
          if (missing.length) {
            console.error(`::error::The trusted revision lacks review tooling: ${missing.join(', ')}. Land the independently reviewed Cairn tooling on the base branch, or have a maintainer set CAIRN_REVIEW_TOOLING_SHA to an independently approved full commit SHA. Do not substitute PR code in this job: later steps receive provider secrets.`);
            process.exit(1);
          }
          NODE

      - name: Take only the corpus from the pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          # Deletions are not applied, so a PR cannot pass by removing a
          # finding the base branch still has; lint runs over what remains.
          git checkout "$HEAD_SHA" -- cairn/ keys/ || true
          git --no-pager diff --stat "${{ github.event.pull_request.base.sha }}" -- cairn/ keys/

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Schema, scope rules, signatures, prose-check detection, and the
      # pattern layer over every finding in the corpus.
      # Exit 1 is errors and fails the job; exit 2 is warnings only and does
      # not. The linter distinguishes them so this choice can be made here
      # rather than being baked in -- today's warnings are mostly "universal
      # scope on one environment", which is true and expected until the corpus
      # has breadth, and failing on them would block every contribution.
      - name: Corpus lint
        run: |
          set +e
          npm run cairn:lint
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then echo "::warning::corpus lint reported warnings"; fi
          if [ "$code" -eq 2 ]; then exit 0; fi
          exit "$code"

      # Commitment and git-ancestry audit: seals must precede reveals.
      - name: Ledger audit
        run: npm run cairn:audit

      # The invariants the scoring depends on. A corpus that lints can still be
      # scored by code that has regressed.
      - name: Invariant tests
        run: npm test

      # Second layer. Fails closed: a quorum of the configured reviewers must
      # answer, and a reviewer that errored or refused has not cleared anything.
      - name: Adversarial review of changed findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Via the environment, never interpolated into the shell line: a
          # branch name is contributor-controlled text.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run cairn:adjudicate -- --changed-against "$BASE_SHA"

      # Everything a finding should be asked before it lands, in one place and
      # in words a contributor can act on. Duplicate detection was the gap that
      # mattered: nothing was asking whether the trap was already recorded, and
      # that is how a corpus ends up with fifty thin records of one trap instead
      # of one record with fifty attesters.
      #
      # Runs even when the model half cannot — a pull request from a fork gets
      # no secrets, which is exactly how somebody outside the team contributes
      # their first finding. It says which half ran.
      - name: review the findings themselves
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run cairn:review -- --changed-against "$BASE_SHA"
