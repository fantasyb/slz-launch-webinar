name: review
on: pull_request
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.pull_request.base.sha }} }
      - run: cp -r "$GITHUB_WORKSPACE/pr-files/." .
      - run: BASE_SHA=${{ github.event.pull_request.base.sha }} ./scripts/review.sh
